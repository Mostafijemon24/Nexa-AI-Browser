name: Release

# Build ready-to-use desktop apps for Windows, macOS and Linux and attach them
# to a GitHub Release. Trigger by pushing a version tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
# or run manually from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (typecheck, lint, tests)
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build and publish desktop app
        # Only export the signing secrets when they are actually configured.
        # Passing them as empty strings (which `${{ secrets.X }}` becomes when a
        # secret is unset) makes electron-builder treat the empty CSC_LINK as a
        # certificate path, resolve it to the project directory and fail the mac
        # build with "<dir> not a file". With the vars absent, electron-builder
        # falls back to the ad-hoc signature configured in electron-builder.yml
        # (`identity: '-'`), which needs no certificate. `shell: bash` is
        # available on the Windows runner too (Git bash).
        shell: bash
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            export APPLE_ID="$APPLE_ID_SECRET"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
          fi
          npm run build && npx electron-builder ${{ matrix.platform }} --publish always
        env:
          # Publishing the Release + assets (provided automatically by Actions).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never auto-discover a Developer ID from the CI keychain; the macOS
          # build is ad-hoc signed (electron-builder.yml `identity: '-'`) unless
          # the real signing secrets below are provided.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # --- Optional code signing ---------------------------------------
          # Provided to the step as *_SECRET and only re-exported above when
          # non-empty, so the default build stays ad-hoc signed and working. Add
          # these secrets in the repo settings to ship signed, OS-trusted builds:
          #   macOS : CSC_LINK (base64 .p12), CSC_KEY_PASSWORD,
          #           APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
          #   Windows: CSC_LINK (base64 .pfx), CSC_KEY_PASSWORD
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
